a.btn{display:inline-flex;align-items:center;gap:12px;margin-top:30px;min-height:58px;padding:0 30px;background:var(--yellow);border:3px solid var(--ink);border-radius:999px;box-shadow:6px 6px 0 var(--ink);font:700 18px "Outfit",sans-serif;color:var(--ink);text-decoration:none}
